# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Weekly, Monday 00:00 UTC. Running our own fork means the docker image is
  # rebuilt from source on every run, so daily is not worth the runner time.
  schedule: [{cron: "0 0 * * 1"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    # The image build has hung silently before (puppeteer postinstall); without this
    # a stuck run burns the 6h default before anyone notices
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      # Own fork of lowlighter/metrics. Upstream has not merged a PR since 2023-12-18
      # and two bugs make the card worse: the activity plugin crashes on the trimmed
      # PushEvent payloads GitHub now returns, and the lines plugin drops every
      # repository whose contributor stats are still computing (202).
      # The action rebuilds its docker image from source when the owner is not
      # "lowlighter", so the branch below is what actually runs. Diff vs upstream:
      # https://github.com/lowlighter/metrics/compare/master...hhh2210:metrics:fix/events-api-pushevent-and-lines-202
      - uses: hhh2210/metrics@fix/events-api-pushevent-and-lines-202
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          # The following additional scopes may be required:
          #  - read:org      (for organization related metrics)
          #  - read:user     (for user related data)
          #  - read:packages (for some packages related data)
          #  - repo          (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: hhh2210
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Hong_Kong
          # Impact-first ordering: contribution calendar -> external PRs -> notable repos,
          # then the weaker "how many repos do I own" stats. Omitted partials are appended.
          config_order: base.header, base.activity+community, isocalendar, followup, notable, base.repositories, lines, languages, activity

          # 342/365 active days, 2077 contributions over the last year
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_lines: yes
          plugin_lines_sections: base
          # No plugin_lines_delay needed: the fork retries the repositories still
          # answering 202 instead of making the user guess a delay

          # Proof that the external contributions are still happening now.
          # visibility=public so private-repo activity never leaks into the card.
          plugin_activity: yes
          plugin_activity_limit: 4
          plugin_activity_days: 0
          plugin_activity_filter: pr, release, review
          plugin_activity_visibility: public

          plugin_followup: yes
          plugin_followup_archived: yes
          # "user" = issues/PRs I opened anywhere on GitHub (external contributions)
          # "repositories" = issues/PRs filed on my own repos
          plugin_followup_sections: user, repositories
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          plugin_notable_types: commit, pull_request
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%